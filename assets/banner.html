<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ModConfigurator banner</title>
<style>
  :root { --ink:#101417; --white:#f4f6f7; --muted:#9aa7ad; --yellow:#f2c230; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:var(--ink); }
  body { position:relative; font-family:Bahnschrift,"Segoe UI",Arial,sans-serif; color:var(--white); }
  .sky { position:absolute; inset:0; background:
      radial-gradient(1100px 650px at 50% 112%, rgba(242,194,48,.34), transparent 70%),
      linear-gradient(180deg,#11181c 0%,#1a2a2c 55%,#2a3a33 100%); }
  .hills { position:absolute; left:0; bottom:0; width:1920px; height:420px; }
  .stage { position:absolute; left:0; right:0; top:0; bottom:0; display:flex; align-items:center; justify-content:flex-start; gap:90px; padding:0 0 40px 260px; }
  .icon { width:420px; height:420px; filter:drop-shadow(0 30px 50px rgba(0,0,0,.55)); flex:none; }
  .kicker { font-size:30px; letter-spacing:.34em; text-transform:uppercase; color:var(--yellow); margin-bottom:20px; }
  h1 { font-size:128px; line-height:.96; font-weight:700; text-transform:uppercase; letter-spacing:.01em; }
  .tag { margin-top:30px; font-size:52px; line-height:1.2; color:#dfe5e8; }
  .brand { position:absolute; left:0; right:0; bottom:58px; text-align:center; font-size:26px; letter-spacing:.4em; text-transform:uppercase; color:rgba(244,246,247,.62); }
  .brand b { color:var(--yellow); font-weight:700; }
</style>
</head>
<body>
  <div class="sky"></div>
  <svg class="hills" viewBox="0 0 1920 420" preserveAspectRatio="none">
    <path d="M0 250 C 240 150, 480 130, 760 210 S 1260 300, 1560 190 S 1800 150, 1920 190 L1920 420 L0 420 Z" fill="#17252a" opacity=".85"/>
    <path d="M0 320 C 300 240, 560 260, 840 320 S 1380 380, 1640 290 S 1840 270, 1920 290 L1920 420 L0 420 Z" fill="#0f181b"/>
  </svg>
  <div class="stage">
    <div class="icon"><svg viewBox="0 0 256 256" width="420" height="420">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8d450"/>
      <stop offset="1" stop-color="#e8aa18"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="60" fill="url(#tile)"/>
  <g stroke="#101417" stroke-width="18" stroke-linecap="round" fill="none">
    <line x1="62" y1="82" x2="194" y2="82"/>
    <line x1="62" y1="128" x2="194" y2="128"/>
    <line x1="62" y1="174" x2="194" y2="174"/>
  </g>
  <g fill="#101417">
    <circle cx="150" cy="82" r="26"/>
    <circle cx="106" cy="128" r="26"/>
    <circle cx="164" cy="174" r="26"/>
  </g>
  <g fill="#f2c230">
    <circle cx="150" cy="82" r="9"/>
    <circle cx="106" cy="128" r="9"/>
    <circle cx="164" cy="174" r="9"/>
  </g>
</svg>
</div>
    <div class="copy">
      <div class="kicker">Over the Hill mod</div>
      <h1>Mod<br>Configurator</h1>
      <div class="tag">Tweak every mod<br>without leaving the game.</div>
    </div>
  </div>
  <div class="brand">by <b>Probastian</b></div>
</body>
</html>
