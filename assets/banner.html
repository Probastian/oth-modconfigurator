<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ModConfigurator banner</title>
<style>
  :root {
    --ink: #101417;
    --white: #f4f6f7;
    --muted: #9aa7ad;
    --yellow: #f2c230;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); }
  body { position: relative; font-family: Bahnschrift, "Segoe UI", Arial, sans-serif; color: var(--white); }

  .sky {
    position: absolute; inset: 0;
    background:
      radial-gradient(1200px 700px at 78% 108%, rgba(242,194,48,.28), transparent 70%),
      linear-gradient(180deg, #11181c 0%, #1a2a2c 55%, #2a3a33 100%);
  }
  .hills { position: absolute; left: 0; bottom: 0; width: 1920px; height: 420px; }

  .copy { position: absolute; left: 140px; top: 0; bottom: 0; width: 960px; display: flex; flex-direction: column; justify-content: center; }
  .kicker { font-size: 30px; letter-spacing: .32em; text-transform: uppercase; color: var(--yellow); margin-bottom: 18px; }
  h1 { font-size: 116px; line-height: .98; font-weight: 700; letter-spacing: .01em; text-transform: uppercase; }
  .tag { margin-top: 34px; font-size: 44px; line-height: 1.25; color: #d7dee1; max-width: 820px; }
  .pills { margin-top: 48px; display: flex; gap: 16px; }
  .pill { padding: 12px 26px; border-radius: 999px; font-size: 26px; letter-spacing: .06em; background: rgba(244,246,247,.10); border: 2px solid rgba(244,246,247,.22); }
  .pill.key { background: var(--yellow); border-color: var(--yellow); color: var(--ink); font-weight: 700; }

  /* mock settings panel, game-style: rounded, dark, white/yellow accents */
  .panel { position: absolute; right: 120px; top: 150px; width: 640px; padding: 34px 38px 38px; border-radius: 34px;
           background: rgba(12,17,19,.82); border: 2px solid rgba(244,246,247,.18); box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .tabs { display: flex; gap: 34px; font-size: 30px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-bottom: 14px; border-bottom: 2px solid rgba(244,246,247,.16); }
  .tabs .on { color: var(--white); border-bottom: 5px solid var(--yellow); margin-bottom: -16px; padding-bottom: 12px; }
  .select { margin: 26px 0 8px; padding: 16px 24px; border-radius: 18px; background: var(--white); color: var(--ink); font-size: 32px; font-weight: 700; display: flex; justify-content: space-between; }
  .row { display: flex; align-items: center; justify-content: space-between; height: 86px; border-bottom: 2px solid rgba(244,246,247,.10); font-size: 32px; }
  .row:last-of-type { border-bottom: 0; }
  .toggle { width: 86px; height: 46px; border-radius: 23px; background: var(--yellow); position: relative; }
  .toggle::after { content: ""; position: absolute; top: 5px; right: 5px; width: 36px; height: 36px; border-radius: 50%; background: var(--ink); }
  .slider { display: flex; align-items: center; gap: 18px; }
  .track { width: 220px; height: 10px; border-radius: 5px; background: rgba(244,246,247,.22); position: relative; }
  .track i { position: absolute; left: 0; top: 0; bottom: 0; width: 62%; border-radius: 5px; background: var(--yellow); }
  .track b { position: absolute; left: 62%; top: -9px; width: 28px; height: 28px; margin-left: -14px; border-radius: 50%; background: var(--white); }
  .val { min-width: 44px; text-align: right; font-weight: 700; }
  .bind { padding: 6px 22px; border-radius: 14px; background: var(--white); color: var(--ink); font-weight: 700; font-size: 30px; }
  .reset { margin-top: 20px; text-align: center; padding: 16px; border-radius: 18px; border: 2px solid rgba(244,246,247,.35); font-size: 28px; letter-spacing: .08em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="sky"></div>
  <svg class="hills" viewBox="0 0 1920 420" preserveAspectRatio="none">
    <path d="M0 250 C 240 150, 480 130, 760 210 S 1260 300, 1560 190 S 1800 150, 1920 190 L1920 420 L0 420 Z" fill="#17252a" opacity=".85"/>
    <path d="M0 320 C 300 240, 560 260, 840 320 S 1380 380, 1640 290 S 1840 270, 1920 290 L1920 420 L0 420 Z" fill="#0f181b"/>
  </svg>

  <div class="copy">
    <div class="kicker">Over the Hill &middot; MelonLoader mod</div>
    <h1>Mod<br>Configurator</h1>
    <div class="tag">An in-game settings editor for every MelonLoader mod.</div>
    <div class="pills">
      <span class="pill key">F7 &nbsp;QUICK WINDOW</span>
      <span class="pill">SETTINGS &rsaquo; MODS</span>
      <span class="pill">NO SETUP</span>
    </div>
  </div>

  <div class="panel">
    <div class="tabs"><span>Controls</span><span class="on">Mods</span></div>
    <div class="select"><span>HShifter</span><span>&#9662;</span></div>
    <div class="row"><span>Enabled</span><span class="toggle"></span></div>
    <div class="row"><span>Clutch button</span><span class="bind">L1</span></div>
    <div class="row"><span>Lever speed</span><span class="slider"><span class="track"><i></i><b></b></span><span class="val">15</span></span></div>
    <div class="row"><span>Use transfer case</span><span class="toggle"></span></div>
    <div class="row"><span>Show HUD</span><span class="toggle"></span></div>
    <div class="reset">Reset to defaults</div>
  </div>
</body>
</html>
